services:
  # Database for n8n and Telegram AI Application Data
  postgres:
    image: postgres:16-alpine
    container_name: telegram_ai_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n8n_password}
      POSTGRES_DB: ${POSTGRES_DB:-telegram_ai_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    networks:
      - app_network

  # n8n Automation Engine
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: telegram_ai_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-telegram_ai_db}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n_user}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n_password}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-admin123456}
      - N8N_EDITOR_BASE_URL=http://localhost:5678/
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Telegram Bot API
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_SECRET_TOKEN=${TELEGRAM_SECRET_TOKEN}
      # Google Gemini AI
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - ENABLE_AI_ASSISTANT=${ENABLE_AI_ASSISTANT:-true}
      # Odoo CRM
      - ODOO_URL=http://odoo:8069
      - ODOO_DB=${ODOO_DB:-odoo_db1}
      - ODOO_USERNAME=${ODOO_USERNAME:-admin@example.com}
      - ODOO_PASSWORD=${ODOO_PASSWORD:-admin_password}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_network

  # Database for Odoo CRM
  db-odoo:
    image: postgres:15-alpine
    container_name: odoo_postgres
    restart: always
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_password
      POSTGRES_DB: postgres
    volumes:
      - odoo_postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  # Odoo 17 Community Edition CRM
  odoo:
    image: odoo:17
    container_name: telegram_ai_odoo
    restart: always
    ports:
      - "8069:8069"
    environment:
      - HOST=db-odoo
      - USER=odoo
      - PASSWORD=odoo_password
    volumes:
      - odoo_data:/var/lib/odoo
      - ./custom_addons:/mnt/extra-addons
    depends_on:
      - db-odoo
    networks:
      - app_network

volumes:
  postgres_data:
  n8n_data:
  odoo_postgres_data:
  odoo_data:

networks:
  app_network:
    driver: bridge
