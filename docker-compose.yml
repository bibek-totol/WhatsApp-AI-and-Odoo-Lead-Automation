version: '3.8'

services:
  # Database for n8n and WhatsApp AI Application Data
  postgres:
    image: postgres:16-alpine
    container_name: whatsapp_ai_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n8n_password}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_ai_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    networks:
      - app_network

  # n8n Automation Engine
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: whatsapp_ai_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-whatsapp_ai_db}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n_user}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n_password}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-admin123456}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_network

  # Database for Odoo CRM
  db-odoo:
    image: postgres:15-alpine
    container_name: odoo_postgres
    restart: always
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_password
      POSTGRES_DB: postgres
    volumes:
      - odoo_postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  # Odoo 17 Community Edition CRM
  odoo:
    image: odoo:17
    container_name: whatsapp_ai_odoo
    restart: always
    ports:
      - "8069:8069"
    environment:
      - HOST=db-odoo
      - USER=odoo
      - PASSWORD=odoo_password
    volumes:
      - odoo_data:/var/lib/odoo
    depends_on:
      - db-odoo
    networks:
      - app_network

volumes:
  postgres_data:
  n8n_data:
  odoo_postgres_data:
  odoo_data:

networks:
  app_network:
    driver: bridge
